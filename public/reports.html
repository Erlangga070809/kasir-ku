<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan — Kasir Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>
            <span>Kasir Digital</span>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </aside>
    <div class="main-wrapper">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <span class="topbar-title">Laporan</span>
        </header>
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Laporan</h1>
            </div>
            <div class="report-tabs">
                <button class="report-tab active" data-tab="sales">Penjualan</button>
                <button class="report-tab" data-tab="profit">Keuntungan</button>
                <button class="report-tab" data-tab="products">Produk</button>
                <button class="report-tab" data-tab="staff">Staff</button>
            </div>
            <div class="filter-bar">
                <input type="date" id="reportStartDate" class="form-input">
                <span>sampai</span>
                <input type="date" id="reportEndDate" class="form-input">
                <button class="btn-primary btn-sm" id="applyReportFilter">Terapkan</button>
                <button class="btn-ghost btn-sm" id="exportReport">Export CSV</button>
            </div>
            <div class="report-content" id="reportContent">
                <div class="skeleton" style="height:300px;"></div>
            </div>
        </main>
    </div>
    <div class="mobile-nav" id="mobileNav">
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/reports.js"></script>
</body>
</html>
