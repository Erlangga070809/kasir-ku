<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventori — Kasir Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>
            <span>Kasir Digital</span>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </aside>
    <div class="main-wrapper">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <span class="topbar-title">Inventori</span>
        </header>
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Pergerakan Stok</h1>
                <div class="page-actions">
                    <button class="btn-primary" id="restockBtn">Restock</button>
                    <button class="btn-ghost" id="adjustBtn">Adjustment</button>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table" id="inventoryTable">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Produk</th>
                            <th>Tipe</th>
                            <th>Jumlah</th>
                            <th>Stok Akhir</th>
                            <th>Referensi</th>
                            <th>Catatan</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="inventoryPagination"></div>
        </main>
    </div>
    <div class="mobile-nav" id="mobileNav">
    </div>
    <div class="modal" id="restockModal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>Restock Produk</h3>
                <button class="modal-close" aria-label="Tutup">&times;</button>
            </div>
            <div class="modal-body">
                <form id="restockForm">
                    <div class="form-group">
                        <label for="restockProduct">Produk</label>
                        <select id="restockProduct" class="form-select" required>
                            <option value="">Pilih Produk</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="restockQuantity">Jumlah</label>
                        <input type="number" id="restockQuantity" class="form-input" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="restockCost">Biaya</label>
                        <input type="number" id="restockCost" class="form-input" min="0">
                    </div>
                    <div class="form-group">
                        <label for="restockSupplier">Supplier</label>
                        <input type="text" id="restockSupplier" class="form-input" placeholder="Nama supplier">
                    </div>
                    <div class="form-group">
                        <label for="restockNote">Catatan</label>
                        <textarea id="restockNote" class="form-input" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-ghost modal-close">Batal</button>
                <button class="btn-primary" id="saveRestock">Simpan</button>
            </div>
        </div>
    </div>
    <div class="modal" id="adjustModal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>Stock Adjustment</h3>
                <button class="modal-close" aria-label="Tutup">&times;</button>
            </div>
            <div class="modal-body">
                <form id="adjustForm">
                    <div class="form-group">
                        <label for="adjustProduct">Produk</label>
                        <select id="adjustProduct" class="form-select" required>
                            <option value="">Pilih Produk</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stok Saat Ini: <strong id="adjustCurrentStock">-</strong></label>
                    </div>
                    <div class="form-group">
                        <label for="adjustActual">Stok Aktual</label>
                        <input type="number" id="adjustActual" class="form-input" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Selisih: <strong id="adjustDifference">-</strong></label>
                    </div>
                    <div class="form-group">
                        <label for="adjustReason">Alasan</label>
                        <select id="adjustReason" class="form-select" required>
                            <option value="">Pilih Alasan</option>
                            <option value="damaged">Rusak</option>
                            <option value="expired">Kadaluarsa</option>
                            <option value="stock_opname">Stock Opname</option>
                            <option value="other">Lainnya</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-ghost modal-close">Batal</button>
                <button class="btn-primary" id="saveAdjust">Simpan</button>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
</body>
</html>
